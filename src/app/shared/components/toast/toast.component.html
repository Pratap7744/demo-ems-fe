@if (toastService.message(); as msg) {
  <div
    class="fixed bottom-4 z-50 rounded-lg px-4 py-3 text-white shadow-lg"
    [class.left-4]="msg.position === 'bottom-left'"
    [class.right-4]="msg.position === 'bottom-right'"
    [class.top-4]="msg.position === 'top-left' || msg.position === 'top-right'"
    [class.bg-red-600]="msg.type === 'error'"
    [class.bg-green-600]="msg.type === 'success'"
  >
    {{ msg.text }}
  </div>
}
